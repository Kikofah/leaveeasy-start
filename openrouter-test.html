<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทดสอบ OpenRouter AI</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
    font-family: monospace;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 1rem;
    cursor: pointer;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #result {
    margin-top: 24px;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #f8fafc;
    white-space: pre-wrap;
    min-height: 40px;
  }
  .hint { font-size: 0.85rem; color: #666; margin-top: 4px; }
  .error { color: #b91c1c; }
</style>
</head>
<body>

<h1>ทดสอบเรียก AI ผ่าน OpenRouter</h1>

<label for="apiKey">API Key (OpenRouter)</label>
<input type="password" id="apiKey" placeholder="sk-or-v1-...">
<p class="hint">
  คีย์นี้จะถูกเก็บไว้ในเบราว์เซอร์ของคุณเท่านั้น (localStorage) — ไม่ถูกบันทึกลงไฟล์ใด ๆ
  <b>ห้ามใส่คีย์จริงลงในโค้ดที่จะ commit/push ขึ้น GitHub</b>
</p>

<label for="model">โมเดล</label>
<input type="text" id="model" value="google/gemini-2.5-flash-lite">

<button id="sendBtn">ส่งข้อความ "สวัสดี"</button>

<div id="result">ยังไม่มีคำตอบ</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const modelInput = document.getElementById('model');
  const sendBtn = document.getElementById('sendBtn');
  const resultEl = document.getElementById('result');

  // เก็บคีย์ไว้ใน localStorage ของเบราว์เซอร์เท่านั้น ไม่เขียนลงไฟล์
  apiKeyInput.value = localStorage.getItem('openrouter_api_key') || '';
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('openrouter_api_key', apiKeyInput.value);
  });

  sendBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    const model = modelInput.value.trim();

    if (!apiKey) {
      resultEl.innerHTML = '<span class="error">กรุณากรอก API Key ก่อน</span>';
      return;
    }

    sendBtn.disabled = true;
    resultEl.textContent = 'กำลังส่งข้อความ...';

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'user', content: 'สวัสดี' }
          ]
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || `HTTP ${response.status}`);
      }

      const reply = data.choices?.[0]?.message?.content || '(ไม่มีข้อความตอบกลับ)';
      resultEl.textContent = reply;
    } catch (err) {
      resultEl.innerHTML = `<span class="error">เกิดข้อผิดพลาด: ${err.message}</span>`;
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>

</body>
</html>
