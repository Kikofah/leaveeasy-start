<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใส่ข้อมูลตัวอย่าง · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-init.js" defer></script>

<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ใส่ข้อมูลตัวอย่างลง Firestore</h1>
    <p class="subtitle">หน้านี้ไม่ใช่หน้าจอของระบบ ใช้ครั้งเดียวตอนตั้งค่าเพื่อใส่ข้อมูลตัวอย่างตามสเปกหัวข้อ 7</p>

      <div class="btn-row">
        <button type="button" id="ปุ่มใส่ข้อมูล">ใส่ข้อมูลตัวอย่าง</button>
      </div>
      <div id="สถานะ" style="margin-top:12px"></div>
    </div>
  </div>
